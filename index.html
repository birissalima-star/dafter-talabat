    return base64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function formatDateTime(ts) {

    const d = new Date(ts);
    const day = String(d.getDate()).padStart(2, "0");
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const year = d.getFullYear();
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, "0");

    return `${day}/${month}/${year} - ${hours}:${minutes} ${ampm}`;

    const toTs = challenge.endDate ? new Date(challenge.endDate + "T23:59:59").getTime() : Infinity;
    const count = orders.filter((o) => (challenge.sellerName === "all" || o.sellerName === challenge.sellerName) &&
        o.createdAt >= fromTs && o.createdAt <= toTs).length;
    const target = Number(challenge.target) || 0;
    const ended = Date.now() > toTs;
    const achieved = target > 0 && count >= target;
    return { count, target, remaining: Math.max(0, target - count), ended, achieved };
}

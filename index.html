function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    const s = String(text || "").replace(/^﻿/, "");
    for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (inQuotes) {
            if (c === '"') {
                if (s[i + 1] === '"') { field += '"'; i++; }
                else inQuotes = false;
            }
            else field += c;
        }
        else if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n" || c === "\r") {
            if (c === "\r" && s[i + 1] === "\n") i++;
            row.push(field); field = "";
            if (row.some((x) => x !== "")) rows.push(row);
            row = [];
        }
        else field += c;
    }
    row.push(field);
    if (row.some((x) => x !== "")) rows.push(row);
    if (rows.length === 0) return [];
    const headers = rows[0].map((h) => h.trim());
    return rows.slice(1).map((r) => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = r[i] !== undefined ? r[i] : ""; });
        return obj;
    });
}

    const toTs = challenge.endDate ? new Date(challenge.endDate + "T23:59:59").getTime() : Infinity;
    const count = orders.filter((o) => (challenge.sellerName === "all" || o.sellerName === challenge.sellerName) &&
        o.createdAt >= fromTs && o.createdAt <= toTs).length;
    const target = Number(challenge.target) || 0;
    const ended = Date.now() > toTs;
    const achieved = target > 0 && count >= target;
    return { count, target, remaining: Math.max(0, target - count), ended, achieved };
}

function seedDeliveryPrices() {

    WILAYA_DATA.order.forEach((w) => {

        (WILAYA_DATA.data[w] || []).forEach(([commune, home, office]) => {

function getDeliveryFee(deliveryPrices, wilaya, commune, deliveryType, promo) {
    if (promo === "free_delivery")
        return 0;
    const entry = deliveryPrices[wilaya] && deliveryPrices[wilaya][commune];
    if (!entry)
        return 0;
    return Number(entry[deliveryType]) || 0;
}
function computeTotal(items, promo, product, deliveryPrices, wilaya, commune, deliveryType) {
    const qty = totalQtyOf(items);
    if (qty === 0)
        return { total: 0, deliveryFee: 0 };
    const unit = promo === "none" ? product.basePrice : product.promoPrice;
    // "الثالثة مجانا": one unit out of the order is free (e.g. 3 ordered -> pay for 2).
    const paidQty = promo === "third_free" ? Math.max(0, qty - 1) : qty;
    const deliveryFee = getDeliveryFee(deliveryPrices, wilaya, commune, deliveryType, promo);
    return { total: paidQty * unit + deliveryFee, deliveryFee };
}

function parseSheetDate(v) {
    const s = String(v || "").trim();
    if (!s) return null;
    const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (m) {
        const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4] || 0), Number(m[5] || 0), Number(m[6] || 0));
        if (!isNaN(d.getTime())) return d;
    }
    const d2 = new Date(s);
    return isNaN(d2.getTime()) ? null : d2;
}

function parseOrderMessage(text, product) {
    const raw = String(text || "");
    const out = {};
    const digits = raw.replace(/[٠-٩]/g, (d) => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
    const compact = digits.replace(/(\d)[\s.\-]+(?=\d)/g, "$1");
    const ph = compact.match(/(?:\+213|00213|0)([567]\d{8})(?!\d)/);
    if (ph)
        out.phone = "0" + ph[1];
    const t = " " + normAr(digits) + " ";
    let bestW = null, bestLen = 0;
    WILAYA_DATA.order.forEach((w) => {
        const cands = [normAr(w), normAr(WILAYA_FR[w] || "")].filter((x) => x.length >= 3);
        cands.forEach((c) => {
            if (t.includes(c) && c.length > bestLen) {
                bestW = w;
                bestLen = c.length;
            }
        });
    });
    const findCommune = (w) => {
        let best = null, len = 0;
        (WILAYA_DATA.data[w] || []).forEach((row) => {
            const c = normAr(row[0]);
            if (c.length >= 4 && t.includes(c) && c.length > len) {
                best = row[0];
                len = c.length;
            }
        });
        return best;
    };
    if (bestW) {
        out.wilaya = bestW;
        const c = findCommune(bestW);
        if (c)
            out.commune = c;
    }
    else {
        for (const w of WILAYA_DATA.order) {
            const c = findCommune(w);
            if (c && normAr(c).length >= 5) {
                out.wilaya = w;
                out.commune = c;
                break;
            }
        }
    }
    const nm = raw.match(/(?:الاسم|الإسم|اسم|nom|name)\s*[:：\-]?\s*([^\n\d]{2,40})/i);
    if (nm)
        out.customerName = nm[1].trim();
    if (product && product.concentrations) {
        const items = {};
        let found = false;
        product.concentrations.forEach((label, i) => {
            const num = (String(label).match(/\d+/) || [])[0];
            if (!num)
                return;
            const re = new RegExp("(?:(\\d)\\s*[x×*]?\\s*)?(?:تركيز|تركيزة|concentration|peeling|بيلينغ)\\s*" + num + "(?!\\d)|(?<!\\d)" + num + "\\s*%", "gi");
            let m, q = 0;
            while ((m = re.exec(digits)) !== null)
                q += Number(m[1]) || 1;
            items[i] = q;
            if (q)
                found = true;
        });
        if (found)
            out.items = items;
    }
    return out;
}

.ticket-exchange-badge { margin-top:8px; background:#FFF0E0; color:#9A5A10; font-weight:700; font-size:12.5px; border-radius:8px; padding:7px 10px; }
.exchange-toggle { width:100%; text-align:center; padding:11px; border-radius:11px; border:1.5px dashed #E8B47A; background:#FFF8ED; color:#9A5A10; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit; }
.exchange-toggle-active { background: linear-gradient(135deg, #E8A857, #C17A2E); color:#fff; border-style:solid; border-color:transparent; box-shadow: 0 3px 10px rgba(193,122,46,0.3); }
.ticket-maps-link { text-decoration:none; cursor:pointer; }
.ticket-maps-link:hover { background:#EFE3FC; }
.notes-section { margin-top:14px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:12px; padding:10px 12px; }
.notes-section-title { font-family:'Cairo',sans-serif; font-weight:700; font-size:13px; color:var(--ink); margin-bottom:8px; }
.notes-empty { font-size:12px; color:var(--ink-dim); margin-bottom:8px; }
.note-item { border-radius:9px; padding:7px 10px; margin-bottom:7px; }
.note-item-admin { background:var(--surface-2); border-right:3px solid #E85A9C; }
.note-item-seller { background:rgba(29,95,168,0.28); border-right:3px solid #4A9FE8; }
.note-item-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:3px; }
.note-item-author { font-size:11px; font-weight:700; color:var(--ink-dim); }
.note-item-time { font-size:10px; color:var(--ink-dim); margin-inline-start:auto; margin-inline-end:6px; }
.note-item-del { background:none; border:none; cursor:pointer; color:var(--ink-dim); padding:2px; display:flex; }
.note-item-del:hover { color:#7A2E2E; }
.note-item-text { font-size:13px; color:var(--ink); line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.note-add-row { display:flex; gap:6px; margin-top:4px; }
.ticket-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
.status-jump { border:1.5px solid rgba(196,19,122,0.25); background:#FBF5F9; color:var(--primary-deep); border-radius:9px; padding:8px 10px; font-size:12px; font-weight:700; font-family:inherit; min-height:38px; max-width:170px; }

.badge { display:flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:20px; white-space:nowrap; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03); }
.badge-pending { background:#E7F1FC; color:#1D5FA8; }
.badge-sent { background:#FBF2E1; color:#8A5A1E; }
.badge-delivered { background:#EAF5EE; color:#2F6F4F; }
.badge-returned { background:#FBEAEA; color:#A13A3A; }
.badge-processing { background:#F3EAFB; color:#5A3A8A; }
.badge-to-wilaya { background:#E7F7F1; color:#1D7A5A; }
.badge-with-driver { background:#FDF0E0; color:#A0642C; }

.seller-list { display:flex; flex-direction:column; gap:8px; }
.seller-row { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:11px 14px; }
.seller-avatar { width:36px; height:36px; border-radius:50%; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Cairo',sans-serif; font-weight:700; flex-shrink:0; box-shadow: 0 2px 8px rgba(196,19,122,0.3); }
.seller-avatar-admin { background: linear-gradient(135deg, #3A1428 0%, #2A0F1E 100%); box-shadow: 0 2px 8px rgba(42,15,30,0.4); }
.seller-info { flex:1; }
.seller-name { font-weight:600; font-size:14px; color:var(--ink); }
.role-tag { font-size:10.5px; font-weight:600; color:#E85A9C; background:var(--surface-2); border-radius:10px; padding:2px 7px; margin-right:6px; }
.seller-count { font-size:11.5px; color:var(--ink-dim); }

.delivery-edit-list { display:flex; flex-direction:column; gap:6px; max-height: 360px; overflow-y: auto; padding-right: 4px; }
.delivery-edit-row { display:grid; grid-template-columns: 1fr 70px 70px 60px; gap:8px; align-items:center; }
.office-checkbox { width:19px; height:19px; margin:0 auto; accent-color: var(--primary); }
.delivery-edit-header { margin-bottom:2px; }
.delivery-edit-label { font-size:11px; font-weight:700; color:var(--ink-dim); text-align:center; }
.delivery-edit-name { font-size:12.5px; color:var(--ink); }

.empty { display:flex; flex-direction:column; align-items:center; gap:8px; color:#DB9DBB; padding: 36px 0; font-size:13.5px; }

@media (min-width: 900px) {
  .dashboard-wide { max-width: 1080px; }
  .tabs { flex-wrap: nowrap; }
}

/* ================= ثيم: أبيض · وردي · ذهبي ================= */
:root {
  --ink: #3B2230;
  --primary: #D4668E;
  --primary-deep: #A9466F;
  --primary-light: #F0A9C2;
  --gold: #C6A04A;
  --gold-deep: #9E7A2A;
  --gold-soft: #F7EDD3;
  --surface: #FFFFFF;
  --surface-2: #FCEFF3;
  --border-soft: #EFD3DE;
  --ink-dim: #957283;
  --bg-a: #F4ECE4;
  --bg-b: #E8D8CA;
}
.app-root {
  background:
    radial-gradient(circle at 100% 0%, rgba(198,160,74,0.14) 0%, transparent 38%),
    radial-gradient(circle at 0% 100%, rgba(212,102,142,0.08) 0%, transparent 40%),
    linear-gradient(170deg, var(--bg-a) 0%, var(--bg-b) 100%);
  background-attachment: fixed;
}
.loading-screen { background: linear-gradient(170deg, var(--bg-a) 0%, var(--bg-b) 100%); }
.loading-mark { background: linear-gradient(135deg, var(--gold), var(--primary)); -webkit-background-clip: text; background-clip: text; }

/* شاشة الدخول */
.landing { background:
    radial-gradient(circle at 15% 8%, rgba(240,169,194,0.35) 0%, transparent 40%),
    radial-gradient(circle at 90% 88%, rgba(198,160,74,0.22) 0%, transparent 38%),
    linear-gradient(165deg, #F6EFE8 0%, #EEE2D6 55%, #E6D4C4 100%); }
.landing::before { background-image: radial-gradient(rgba(198,160,74,0.9) 1px, transparent 1px); background-size: 38px 38px; opacity: 0.12; }
.brand-mark { background: linear-gradient(135deg, var(--gold), var(--primary)); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 2px 6px rgba(198,160,74,0.35)); }
.brand-title { color: var(--primary-deep); }
.brand-sub { color: var(--gold-deep); }
.landing-copy { color: var(--ink-dim); }
.role-card { background: rgba(255,255,255,0.85); border: 1px solid var(--border-soft); color: var(--gold); box-shadow: 0 8px 24px rgba(169,70,111,0.08); }
.role-card:hover { background: #fff; border-color: var(--gold); box-shadow: 0 14px 30px rgba(169,70,111,0.14); }
.role-title { color: var(--primary-deep); }
.role-desc { color: var(--ink-dim); }
.role-arrow { color: var(--gold); }
.lang-toggle-landing { background: #fff; border: 1px solid var(--gold); color: var(--gold-deep); }
.landing .back-link { background: rgba(255,255,255,0.8); color: var(--primary-deep); border-bottom-color: var(--border-soft); }
.auth-title { color: var(--primary-deep); }
.landing .hint { color: var(--ink-dim); }
.landing .err { color: #A13A3A; }

/* الأزرار */
.btn-primary, .btn-mini-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%); box-shadow: 0 4px 14px rgba(169,70,111,0.25); }
.btn-primary:hover { box-shadow: 0 6px 20px rgba(169,70,111,0.35); }
.input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(198,160,74,0.18); }

/* الشريط العلوي: أبيض بخط ذهبي */
.topbar { background: #FFFFFF; border: 1px solid var(--border-soft); border-bottom: 2px solid var(--gold); box-shadow: 0 6px 20px rgba(169,70,111,0.08); }
.topbar-title { color: var(--primary-deep); }
.topbar-sub { color: var(--gold-deep); }

/* لمسات */
.tabs { background: var(--surface-2); }
.tab-active { color: var(--primary-deep); }
.pill-active { background: var(--primary); border-color: var(--primary); }
.home-tile-notif { background: linear-gradient(150deg, var(--primary) 0%, var(--primary-deep) 100%); }
.challenge-toast { background: var(--primary); }
.seller-avatar-admin { background: linear-gradient(135deg, #D8B566 0%, var(--gold-deep) 100%); box-shadow: 0 2px 8px rgba(158,122,42,0.35); }
.note-item-admin { border-right-color: var(--primary); }
.ticket-seller, .role-tag, .ticket-time-btn:hover { color: var(--primary-deep); }
.home-tile-count { background: var(--gold-soft); color: var(--gold-deep); }
.new-badge { background: linear-gradient(135deg, #D8B566, var(--gold-deep)); }
.home-tile, .form-card, .ticket, .stats-card { border-color: #F3E3C4; box-shadow: 0 3px 14px rgba(169,70,111,0.06); }
.home-tile:hover { box-shadow: 0 10px 24px rgba(169,70,111,0.12); border-color: var(--gold); }
.home-tile-primary { background: linear-gradient(150deg, var(--primary) 0%, var(--primary-deep) 100%); border: 1px solid var(--gold); box-shadow: 0 8px 22px rgba(169,70,111,0.28); }

/* ================= أزرار "ديجيتال" ================= */
.btn-primary, .btn-mini-primary { position:relative; overflow:hidden; letter-spacing:.01em; border:1px solid rgba(216,181,102,0.55); transition: transform .12s ease, box-shadow .2s ease; }
.btn-primary::after, .btn-mini-primary::after { content:""; position:absolute; top:0; bottom:0; width:40%; left:-60%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent); transform: skewX(-20deg); animation: btnShine 3.6s ease-in-out infinite; pointer-events:none; }
@keyframes btnShine { 0%, 70% { left:-60%; } 100% { left:130%; } }
.btn-primary:active, .btn-mini-primary:active, .btn-ghost:active, .btn-icon:active, .pill:active, .status-jump:active, .home-tile:active { transform: scale(.96); }
.btn-primary:hover { box-shadow: 0 8px 24px rgba(169,70,111,0.32), 0 0 0 3px rgba(216,181,102,0.25); }
.btn-ghost, .btn-icon { transition: transform .12s ease, border-color .15s, box-shadow .2s, color .15s; }
.btn-ghost:hover, .btn-icon:hover { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(216,181,102,0.18); color: var(--primary-deep); }
.pill { transition: transform .12s ease, background .15s, box-shadow .2s; }
.pill-active { box-shadow: 0 4px 12px rgba(169,70,111,0.25), inset 0 0 0 1px rgba(216,181,102,0.6); }
.status-jump { transition: transform .12s ease, box-shadow .2s, border-color .15s; }
.status-jump:hover { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(216,181,102,0.18); }

/* البلاطات: دخول متتابع + توهج */
.home-tile { animation: tileIn .45s cubic-bezier(.2,.9,.3,1.15) backwards; transition: transform .18s ease, box-shadow .2s ease, border-color .2s; }
.home-tile:nth-child(1) { animation-delay: .02s; } .home-tile:nth-child(2) { animation-delay: .06s; } .home-tile:nth-child(3) { animation-delay: .10s; }
.home-tile:nth-child(4) { animation-delay: .14s; } .home-tile:nth-child(5) { animation-delay: .18s; } .home-tile:nth-child(6) { animation-delay: .22s; }
.home-tile:nth-child(7) { animation-delay: .26s; } .home-tile:nth-child(8) { animation-delay: .30s; } .home-tile:nth-child(9) { animation-delay: .34s; }
.home-tile:nth-child(n+10) { animation-delay: .38s; }
@keyframes tileIn { from { opacity:0; transform: translateY(14px) scale(.96); } to { opacity:1; transform:none; } }
.home-tile:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(169,70,111,0.14), 0 0 0 3px rgba(216,181,102,0.20); }
.home-tile > span:first-child { transition: transform .25s cubic-bezier(.2,.9,.3,1.4); }
.home-tile:hover > span:first-child { transform: scale(1.18) rotate(-6deg); }
.home-tile-primary::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%); background-size: 250% 100%; animation: tileShine 4s ease-in-out infinite; }
@keyframes tileShine { 0%, 65% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
.home-tile-count { box-shadow: 0 0 0 1px rgba(198,160,74,0.35); font-variant-numeric: tabular-nums; }

/* الحقول */
.input { transition: border-color .15s, box-shadow .2s, background .2s; }
.input:focus { background: #FFFDF8; }

/* البطاقات تدخل بنعومة */
.ticket, .form-card { animation: cardIn .35s ease backwards; }
@keyframes cardIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .home-tile, .ticket, .form-card, .btn-primary::after, .home-tile-primary::after { animation: none !important; } }

.mv-btn-motivate { background: linear-gradient(135deg, #FFF6E2, #F7EDD3); border:1px solid #D8B566; color:#9E7A2A; border-radius:9px; padding:8px; cursor:pointer; font-size:15px; min-width:38px; min-height:38px; display:flex; align-items:center; justify-content:center; margin-left:4px; transition: transform .12s, box-shadow .2s; }
.mv-btn-motivate:hover { box-shadow: 0 0 0 3px rgba(216,181,102,0.25); transform: translateY(-1px); }
.mv-all { width:100%; margin-bottom:12px; }
.no-money .ticket-price, .no-money .ticket-delivery-fee, .no-money .stats-revenue { display:none !important; }
.note-kinds { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 6px; }
.note-kind-btn { border:1px solid #EFD3DE; background:#fff; color:#A9466F; border-radius:14px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
.note-kind-on { background:#A9466F; color:#fff; border-color:#A9466F; }
.note-kind { display:inline-block; font-size:11px; font-weight:700; border-radius:10px; padding:2px 8px; margin:4px 0 2px; background:#FFF6E2; color:#9E7A2A; }
.note-kind-claim { background:#FDE7E7; color:#B42318; }
/* بطاقات الدخول (الإدارة / بائعة) بالذهبي */
.role-card { background: linear-gradient(135deg, #F6E7BE 0%, #E2C27A 55%, #C9A04E 100%) !important; border: 1px solid #B8913E !important; box-shadow: 0 12px 28px rgba(158,122,42,0.30), inset 0 1px 0 rgba(255,255,255,0.6) !important; position: relative; overflow: hidden; }
.role-card::after { content:""; position:absolute; top:0; bottom:0; width:40%; left:-60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent); transform: skewX(-20deg); animation: btnShine 4s ease-in-out infinite; pointer-events:none; }
.role-card:hover { box-shadow: 0 16px 34px rgba(158,122,42,0.40), 0 0 0 3px rgba(255,255,255,0.6) !important; }
.role-card .role-title { color: #4A2338 !important; }
.role-card .role-desc { color: #5E3A2A !important; }
.role-card .role-arrow, .role-card svg { color: #4A2338 !important; }
html[data-lang="fr"] .app-root, html[data-lang="fr"] [dir="ltr"], html[data-lang="fr"] .dashboard { direction: ltr; }
html[data-lang="fr"] .note-item-text, html[data-lang="fr"] .ticket-customer, html[data-lang="fr"] .mv-text { direction: rtl; unicode-bidi: plaintext; }
.copy-order-btn { border:1px solid #E9D3A0; background:#FFF8EA; color:#9E7A2A; border-radius:12px; padding:5px 10px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; transition: transform .12s, box-shadow .2s; }
.copy-order-btn:hover { box-shadow: 0 0 0 3px rgba(216,181,102,0.22); }
.copy-order-btn:active { transform: scale(.95); }
`;
